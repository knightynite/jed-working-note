<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Equal aggregate score, different decision trace</title>
  <desc id="desc">On the tagged_local_publish witness, deny_tagged and confirm_tagged both have a toy aggregate of fourteen custom units and neither executes the proposed action. One emits deny and the other emits confirm, demonstrating that the scalar aggregate erases decision semantics.</desc>
  <rect width="1200" height="430" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
    .panel { fill: #f7f9fc; stroke: #51606f; stroke-width: 3; rx: 16; }
    .deny { fill: #fff0f0; stroke: #a33a3a; stroke-width: 3; rx: 12; }
    .confirm { fill: #fff7df; stroke: #a66a00; stroke-width: 3; rx: 12; }
    .score { fill: #eef5ff; stroke: #2864a8; stroke-width: 3; rx: 18; }
    .title { font-size: 28px; font-weight: 700; text-anchor: middle; }
    .label { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .small { font-size: 18px; text-anchor: middle; }
    .arrow { stroke: #44515f; stroke-width: 4; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#44515f"/>
    </marker>
  </defs>
  <text class="title" x="600" y="48">A scalar can preserve the score and erase the decision</text>
  <rect class="panel" x="55" y="85" width="430" height="245"/>
  <text class="label" x="270" y="125">deny_tagged</text>
  <rect class="deny" x="145" y="150" width="250" height="65"/>
  <text class="label" x="270" y="191">DENY</text>
  <text class="small" x="270" y="252">executed: none</text>
  <text class="small" x="270" y="282">effect: not_executed</text>
  <rect class="panel" x="715" y="85" width="430" height="245"/>
  <text class="label" x="930" y="125">confirm_tagged</text>
  <rect class="confirm" x="805" y="150" width="250" height="65"/>
  <text class="label" x="930" y="191">CONFIRM</text>
  <text class="small" x="930" y="252">executed: none</text>
  <text class="small" x="930" y="282">effect: not_executed</text>
  <rect class="score" x="500" y="130" width="200" height="115"/>
  <text class="label" x="600" y="176">toy aggregate</text>
  <text class="title" x="600" y="218">14 = 14</text>
  <path class="arrow" d="M485 187 H495"/>
  <path class="arrow" d="M715 187 H705"/>
  <text class="small" x="600" y="365">Witness: tagged_local_publish — same immediate effect and cell; different decision trace.</text>
  <text class="small" x="600" y="397">Custom toy units; bounded synthetic counterexample — no private policy is identified.</text>
</svg>
