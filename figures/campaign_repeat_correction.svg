  <line class="fresh" x1="880" y1="292" x2="1090" y2="292"/>
  <text class="label" x="118" y="104">Earlier 11: mean 119.606364</text>
  <text class="label" x="866" y="104">Fresh 4</text>
  <text class="small" x="868" y="127">mean 114.406250</text>
  <text class="small" x="110" y="407">1</text>
  <text class="small" x="800" y="407">11</text>
  <text class="small" x="875" y="407">12</text>
  <text class="small" x="1082" y="407">15</text>
  <text class="small" x="600" y="430" text-anchor="middle">Ordered hosted draw</text>
  <text class="small" x="600" y="458" text-anchor="middle">Conditional on the author-reported pre-score designation: within-family rank 3/1365; not multiplicity-adjusted.</text>
  <text class="small" x="600" y="486" text-anchor="middle">Operational result: retire the stationary forecast; no evaluator, runtime, parser, model, or policy cause is identified.</text>
</svg>
